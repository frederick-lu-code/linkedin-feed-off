<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LinkedIn Feed Off</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">LinkedIn Feed Off</p>
          <h1 id="status-title">Feed is off</h1>
        </div>
        <label class="switch">
          <span class="sr-only">Disable LinkedIn feed</span>
          <input id="enabled" type="checkbox" checked />
          <span class="slider" aria-hidden="true"></span>
        </label>
      </header>
      <p id="status-copy">Jobs and your own profile still work.</p>
      <div class="option" id="profiles-option">
        <div>
          <p class="option-title">Block other profiles</p>
          <p class="option-copy">Hide other people's profiles, My Network, and people search. Your own profile stays editable.</p>
        </div>
        <label class="switch">
          <span class="sr-only">Block other people's profiles</span>
          <input id="block-profiles" type="checkbox" checked />
          <span class="slider" aria-hidden="true"></span>
        </label>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
